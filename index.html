<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SupportOps — the autonomous support escalation hub. Paste a ticket, get a tiered triage, root-cause diagnosis, a customer-ready reply, and a clear escalation call." />
    <meta name="theme-color" content="#f7f5f1" />
    <title>SupportOps — Autonomous Support Escalation Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      body { background: #f7f5f1; margin: 0; font-family: "Instrument Sans", system-ui, sans-serif; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #loading > div { text-align: center; color: #7a746a; font-size: 14px; }
      #loading .spinner { width: 24px; height: 24px; border: 3px solid #e6ded1; border-top-color: #d97706; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; box-shadow: 0 0 22px rgba(217, 119, 6, 0.18); }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading"><div><div class="spinner"></div>Booting SupportOps…</div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
