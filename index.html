<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SupportOps — the autonomous support escalation hub. Paste a ticket, get a tiered triage, root-cause diagnosis, a customer-ready reply, and a clear escalation call." />
    <meta name="theme-color" content="#05060B" />
    <title>SupportOps — Autonomous Support Escalation Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      body { background: #05060b; margin: 0; font-family: "Space Grotesk", system-ui, sans-serif; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #loading > div { text-align: center; color: #6a7593; font-size: 14px; }
      #loading .spinner { width: 24px; height: 24px; border: 3px solid #1c2438; border-top-color: #ff8a3d; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; box-shadow: 0 0 22px rgba(255, 138, 61, 0.35); }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading"><div><div class="spinner"></div>Booting SupportOps…</div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
