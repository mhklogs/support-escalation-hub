<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SupportOps — the autonomous support escalation hub. Paste a ticket, get a tiered triage, root-cause diagnosis, a customer-ready reply, and a clear escalation call." />
    <meta name="theme-color" content="#f9f8f6" />
    <title>SupportOps — Autonomous Support Escalation Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      body { background: #f9f8f6; margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #loading > div { text-align: center; color: #8a8578; font-size: 14px; }
      #loading .spinner { width: 24px; height: 24px; border: 3px solid #e6ded1; border-top-color: #d97706; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading"><div><div class="spinner"></div>Booting SupportOps…</div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
